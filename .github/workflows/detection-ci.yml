name: Detection CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Validate and test detection rules
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tools
        run: pip install -r requirements.txt

      - name: Validate Sigma rules (syntax, metadata, ATT&CK tags)
        run: sigma check --fail-on-issues rules/sigma

      - name: Test rules against sample logs
        run: pytest scripts -v