id: f1a10982-13ae-47ee-868e-054ee2fb1cac
name: Password Spray Against Entra ID From a Single IP
description: |
  Detects one IP address failing to sign in as many different Entra ID users with a wrong password
  within an hour. Trying one common password against many accounts avoids per-account lockout,
  which is the signature of a password spray.
severity: Medium
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1110.003
query: |
  let min_distinct_users = 5;
  SigninLogs
  | where ResultType == "50126"
  | summarize
      DistinctUsers = dcount(UserPrincipalName),
      Attempts = count(),
      TargetedUsers = make_set(UserPrincipalName, 50),
      FirstSeen = min(TimeGenerated),
      LastSeen = max(TimeGenerated)
      by IPAddress
  | where DistinctUsers >= min_distinct_users
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
version: 1.0.0
kind: Scheduled