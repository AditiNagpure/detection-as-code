id: ca06b921-57f3-4f9a-b443-e056f42d37f0
name: Break-Glass Admin Account Sign-In
description: |
  Alerts on any sign-in attempt, successful or not, to an emergency break-glass account. These
  accounts bypass Conditional Access and should only be used in a declared emergency, so every
  sign-in needs to be explained.
severity: High
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
queryFrequency: 15m
queryPeriod: 15m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
  - Persistence
  - PrivilegeEscalation
relevantTechniques:
  - T1078.004
query: |
  let break_glass_accounts = dynamic(["breakglass@AditiSecurityLab.onmicrosoft.com"]);
  SigninLogs
  | where UserPrincipalName in~ (break_glass_accounts)
  | project TimeGenerated, UserPrincipalName, IPAddress, Location, AppDisplayName,
      ResultType, ResultDescription, ConditionalAccessStatus
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: UserPrincipalName
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
version: 1.0.0
kind: Scheduled