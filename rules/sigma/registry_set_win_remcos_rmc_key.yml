title: Remcos RAT Configuration Registry Key
id: 896ae4b3-3603-4067-b346-14e2f020cc7b
status: test
description: Detects values written under HKCU\Software\Rmc-<random>, the key where the Remcos agent stores its install path (exepath) and the operator's licence ID (licence).
references:
    - https://attack.mitre.org/software/S0332/
    - https://attack.mitre.org/techniques/T1112/
    - https://app.any.run/tasks/218662a7-3d0e-4d3b-a39d-23d183123727
author: Aditi Nagpure
date: 2026-11-18
tags:
    - attack.defense-impairment
    - attack.t1112
logsource:
    category: registry_set
    product: windows
detection:
    selection_key:
        TargetObject|contains: '\SOFTWARE\Rmc-'
    selection_value:
        TargetObject|endswith:
            - '\exepath'
            - '\licence'
    condition: all of selection_*
falsepositives:
    - Unlikely; no known legitimate software uses this key name with these value names
level: critical
