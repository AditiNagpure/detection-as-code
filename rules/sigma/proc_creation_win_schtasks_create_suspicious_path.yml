title: Scheduled Task Created to Run From a User-Writable Folder
id: 8ed5a71a-bee5-4419-8d1e-f54c8b31df41
status: test
description: Detects schtasks.exe creating a task whose program lives in a user-writable folder such as AppData, Temp or Users\Public, a common way for malware to survive reboots.
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: Aditi Nagpure
date: 2026-11-14
tags:
    - attack.persistence
    - attack.execution
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\schtask.exe'
    selection_create:
        CommandLine|contains: ' /create '
    selection_path:
        CommandLine|contains:
            - '\AppData\'
            - '\Temp\'
            - '\Users\Public\'
    condition: all of selection_*
falsepositives:
    - Software updaters that install their scheduled tasks under AppData
level: high