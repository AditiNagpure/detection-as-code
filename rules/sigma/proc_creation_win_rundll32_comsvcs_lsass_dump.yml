title: LSASS Memory Dump via Comsvcs MiniDump
id: 15704708-0131-444c-8562-aa54c938207e
status: test
description: Detects rundll32.exe calling the MiniDump function of comsvcs.dll, a built-in Windows way to dump LSASS memory and steal credentials without bringing in a tool like Mimikatz.
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: Aditi Nagpure
date: 2026-11-14
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\rundll32.exe'
    selection_dll:
        CommandLine|contains: 'comsvcs'
    selection_func:
        CommandLine|contains:
            - 'MiniDump'
            - '#24'
    condition: all of selection_*
falsepositives:
    - Very unlikely; administrators rarely create memory dumps this way
level: high